<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lista de notebooks</title>
<style>
:root{--fundo:#f7f6f2;--cartao:#fff;--texto:#1f2421;--fraco:#5f6661;--linha:#dcdcd4;--marca:#17603f;--marca-txt:#fff;--aviso:#8a4b00;--aviso-fundo:#fdf0dc;--ruim:#a02a22;--ruim-fundo:#fbe6e3;--ok-fundo:#e3f1e9}
@media (prefers-color-scheme:dark){:root{--fundo:#191c1a;--cartao:#232725;--texto:#ecefec;--fraco:#a7afa9;--linha:#3a403c;--marca:#5fc493;--marca-txt:#0d2318;--aviso:#f1c27d;--aviso-fundo:#3b2c14;--ruim:#f0a59e;--ruim-fundo:#43211e;--ok-fundo:#1e3a2c}}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tudo{max-width:1240px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:0}h2{font-size:1.1rem;margin:1.6em 0 .5em}
.topo{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.sub{color:var(--fraco);font-size:.88rem}
.alerta{background:var(--ruim-fundo);color:var(--ruim);padding:10px 12px;border-radius:8px;margin:12px 0;font-weight:600}
.abas{display:flex;gap:6px;margin:14px 0}
.abas button{font:inherit;font-weight:600;padding:9px 18px;border:1px solid var(--linha);border-radius:8px;background:var(--cartao);color:var(--texto);cursor:pointer}
.abas button[aria-selected=true]{background:var(--marca);border-color:var(--marca);color:var(--marca-txt)}
.filtros{display:flex;flex-wrap:wrap;gap:10px 14px;background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:12px;margin-bottom:12px}
.filtros label{display:flex;flex-direction:column;font-size:.8rem;color:var(--fraco);gap:3px}
select{font:inherit;color:var(--texto);background:var(--fundo);border:1px solid var(--linha);border-radius:6px;padding:6px 8px;min-height:38px}
.cont{font-size:.88rem;color:var(--fraco);margin:0 0 8px}
.cartoes{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.c{background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.c h3{margin:0;font-size:1rem;line-height:1.3;overflow-wrap:anywhere}
.preco{font-size:1.45rem;font-weight:700}.preco small{font-size:.85rem;font-weight:400;color:var(--fraco)}
.botao{display:block;text-align:center;background:var(--marca);color:var(--marca-txt);text-decoration:none;font-weight:600;padding:10px;border-radius:8px}
.et{display:flex;flex-wrap:wrap;gap:5px}
.et span{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--aviso-fundo);color:var(--aviso)}
.et span.bom{background:var(--ok-fundo);color:var(--marca)}.et span.ruim{background:var(--ruim-fundo);color:var(--ruim)}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:.86rem}dt{color:var(--fraco)}dd{margin:0;min-width:0;overflow-wrap:anywhere}
details{font-size:.86rem}summary{cursor:pointer;color:var(--fraco)}
.outras{list-style:none;padding:0;margin:6px 0 0}.outras li{padding:2px 0}
a{color:var(--marca)}
.ana{background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:4px 16px 16px;max-width:820px}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--linha);vertical-align:top}
.rolar{overflow-x:auto}
.velho{color:var(--aviso);font-weight:600}
.cob{background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.cob summary{color:var(--texto);font-weight:600}.cob .ruim{color:var(--ruim);font-weight:600}
#tabela{display:none}
#tabela td,#tabela th{font-size:.82rem}
@media (min-width:1000px){#cartoes{display:none}#tabela{display:block}}
</style>
</head>
<body>
<div class="tudo">
  <div class="topo"><h1>Lista de notebooks</h1><span class="sub" id="idade">carregando…</span></div>
  <div class="sub" id="cambio"></div>
  <div id="alerta"></div>
  <div class="abas" role="tablist">
    <button role="tab" id="b-lista" aria-selected="true">Lista</button>
    <button role="tab" id="b-ana" aria-selected="false">Análise</button>
  </div>
  <section id="lista">
    <details class="cob" id="cob"></details>
    <div class="filtros">
      <label>Preço final até<select id="f-preco"><option value="">qualquer</option><option>7000</option><option>7500</option><option>8000</option><option>8500</option></select></label>
      <label>Memória<select id="f-ram"><option value="">todas</option><option value="32">32 GB</option><option value="16">16 GB</option></select></label>
      <label>Placa de vídeo<select id="f-gpu"><option value="">todas</option><option value="5060">RTX 5060</option><option value="5070">RTX 5070 ou superior</option></select></label>
      <label>Tamanho<select id="f-tam"><option value="">todos</option><option value="15">até 15,6"</option><option value="16">16"</option><option value="17">17" ou mais</option></select></label>
      <label>Estoque<select id="f-est"><option value="">todos</option><option value="1">só com estoque</option></select></label>
    </div>
    <p class="cont" id="cont"></p>
    <div class="cartoes" id="cartoes"></div>
    <div class="rolar" id="tabela"></div>
  </section>
  <section id="ana" hidden><div class="ana" id="ana-c"></div></section>
</div>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seguro=u=>/^https:\/\//.test(u||'')?esc(u):'#';
const us=v=>v==null?'—':'US$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const rs=v=>v==null?'—':'R$ '+v.toLocaleString('pt-BR');
function quando(iso){if(!iso)return'data desconhecida';const h=(Date.now()-new Date(iso))/36e5;if(h<1)return'há menos de 1 hora';if(h<36)return'há '+Math.round(h)+' h';return'há '+Math.round(h/24)+' dias';}
function dataBR(s){const[a,m,d]=String(s).slice(0,10).split('-');return d+'/'+m+'/'+a;}
const velho=iso=>!iso||(Date.now()-new Date(iso))/36e5>=36;
const idade=iso=>velho(iso)?`<span class="velho">preço ${iso?'de '+dataBR(iso):'sem data'}, não é de hoje</span>`:'preço visto '+quando(iso);
const origem=m=>({pagina:'',api:' (interface oficial)',claude:' (lido no Chrome)',gamingdeals:' (GamingLaptop.Deals)'}[m.fonte]??' (só na busca)');
function lendo(c){return c.itens>0||!!c.claude?.itens;}
function quadro(){
  const q=D.cobertura||[];if(!q.length){$('cob').innerHTML='<summary>Cobertura por loja: sem dado ainda</summary>';return;}
  const ob=q.filter(c=>c.obrigatoria),sem=ob.filter(c=>!lendo(c));
  const script=c=>c.lido_em?`${c.itens} itens · ${c.estado}${c.motivo?': '+c.motivo:''}<div class="sub">${dataBR(c.lido_em)} (${quando(c.lido_em)})</div>`:'não usado';
  const chrome=x=>x?`${x.itens} itens em ${x.paginas||'?'} página(s) · ${esc(x.estado||'lida')}${x.motivo?': '+esc(x.motivo):''}<div class="sub">${dataBR(x.em)} (${quando(x.em)})</div>`:'não usado';
  const linha=c=>{const l=c.claude&&!c.claude.itens&&c.claude.link||c.link;return `<tr><td>${esc(c.loja)}</td><td class="${c.lido_em&&!c.itens?'ruim':''}">${script(c)}</td><td>${chrome(c.claude)}</td><td class="${lendo(c)?'':'ruim'}">${lendo(c)?'lida':'não verificado'}${l&&!lendo(c)?` · <a href="${seguro(l)}" rel="noopener noreferrer" target="_blank">abrir a loja</a>`:''}</td></tr>`;};
  $('cob').innerHTML=`<summary>Cobertura: ${ob.length-sem.length} de ${ob.length} lojas obrigatórias com leitura${sem.length?' · sem leitura: '+esc(sem.map(c=>c.loja).join(', ')):''}</summary><div class="rolar"><table><tr><th>Loja</th><th>Script</th><th>Chrome</th><th>Situação</th></tr>${q.map(linha).join('')}</table></div>`;
  $('cob').open=sem.length>0;
}
let D;
function cartao(m){
  const et=[...m.etiquetas.map(e=>`<span class="${e==='acima do teto'?'ruim':''}" title="${esc(e==='conferir'?(m.conferir||[]).join('; '):'')}">${esc(e)}</span>`)];
  if(m.promo)et.unshift(`<span class="bom">caiu ${esc(m.promo.queda_pct)}%${m.promo.menor_ja_visto?' · menor já visto':''}</span>`);
  else if(m.usd<=m.menor_visto&&D.bf)et.unshift('<span class="bom">menor já visto</span>');
  if(m.estoque===false)et.unshift('<span class="ruim">esgotado</span>');
  const antes=m.antes?`<div class="sub">"Antes" segundo a loja: ${us(m.antes)} · menor que já vimos: ${us(m.menor_visto)}</div>`:`<div class="sub">Menor que já vimos: ${us(m.menor_visto)}</div>`;
  const out=(m.outras||[]).map(o=>`<li><a href="${seguro(o.url)}" rel="noopener noreferrer" target="_blank">${esc(o.loja)}</a> ${us(o.usd)}${o.vendedor?' · '+esc(o.vendedor):''} · ${idade(o.visto)}</li>`).join('');
  return `<article class="c"><h3>${m.pos}. ${esc(m.nome)}</h3>
  <div class="et">${et.join('')}</div>
  <div class="preco">${rs(m.rs)} <small>${us(m.usd)} na etiqueta</small></div>
  ${m.rs_com_pente?`<div class="sub">Com pente de memória até 32 GB: cerca de ${rs(m.rs_com_pente)}</div>`:''}
  ${antes}
  <a class="botao" href="${seguro(m.url)}" rel="noopener noreferrer" target="_blank">Ver na ${esc(m.loja)}</a>
  <div class="sub">${m.direto?'Venda direta':'Vendedor: '+esc(m.vendedor||'não lido')} · ${idade(m.visto)}${origem(m)}</div>
  <dl>
   <dt>Processador</dt><dd>${esc(m.cpu||'não lido')}${m.cinebench?` · ${m.cinebench.um.toLocaleString('pt-BR')} / ${m.cinebench.varios.toLocaleString('pt-BR')}`:''}</dd>
   <dt>Placa</dt><dd>${esc(m.placa||'RTX '+(m.gpu||'?'))}</dd>
   <dt>Ampliar</dt><dd>Memória: ${esc(m.memoria||'não informado')} · 2º SSD: ${esc(m.ssd2)}</dd>
   <dt>Ruído</dt><dd>${esc(m.ruido||'sem medição achada')}</dd>
   <dt>Teclado</dt><dd>${esc(m.topo||'sem medição achada')}</dd>
   <dt>Tela</dt><dd>${esc(m.tela_ficha||'não levantada')}</dd>
   <dt>Peso</dt><dd>${esc(m.peso||'não levantado')}</dd>
  </dl>
  ${out?`<details><summary>Outras lojas (${m.outras.length})</summary><ul class="outras">${out}</ul></details>`:''}
  <details><summary>Descrição da loja</summary>${esc(m.titulo)}</details>
  </article>`;
}
function etq(m){return m.etiquetas.concat(m.estoque===false?['esgotado']:[],m.promo?['caiu '+m.promo.queda_pct+'%']:[]).join(' · ');}
function linhaT(m){return `<tr><td>${m.pos}</td><td><a href="${seguro(m.url)}" rel="noopener noreferrer" target="_blank">${esc(m.nome)}</a><div class="sub">${esc(etq(m))}</div></td><td><b>${rs(m.rs)}</b><div class="sub">${us(m.usd)}</div></td><td>${esc(m.loja)}<div class="sub">${m.direto?'direto':esc(m.vendedor||'não lido')} · ${idade(m.visto)}${origem(m)}</div>${(m.outras||[]).map(o=>`<div class="sub"><a href="${seguro(o.url)}" rel="noopener noreferrer" target="_blank">${esc(o.loja)}</a> ${us(o.usd)} · ${idade(o.visto)}</div>`).join('')}</td><td>${m.cinebench?m.cinebench.um.toLocaleString('pt-BR')+' / '+m.cinebench.varios.toLocaleString('pt-BR'):'sem dado'}</td><td>${esc(m.placa||'não informado')}</td><td>${esc(m.memoria||'não informado')}<div class="sub">2º SSD: ${esc(m.ssd2)}</div></td><td>${esc(m.ruido||'sem medição')}</td><td>${esc(m.topo||'sem medição')}</td><td>${esc(m.tela_ficha||'não levantada')}</td><td>${esc(m.peso||'não levantado')}</td></tr>`;}
function desenhar(){
  const p=+$('f-preco').value,r=$('f-ram').value,g=$('f-gpu').value,t=$('f-tam').value,e=$('f-est').value;
  const v=D.modelos.filter(m=>(!p||m.rs<=p)&&(!r||String(m.ram)===r)&&(!g||(g==='5060'?/^5060/.test(m.gpu):!/^5060/.test(m.gpu)))&&
    (!t||(t==='15'?m.polegadas&&m.polegadas<16:t==='16'?m.polegadas>=16&&m.polegadas<17:m.polegadas>=17))&&(!e||m.estoque!==false));
  $('cont').textContent=v.length+' de '+D.modelos.length+' notebooks. Ordem do ranking: 32 GB primeiro.';
  $('cartoes').innerHTML=v.map(cartao).join('')||'<p>Nenhum notebook com esses filtros.</p>';
  $('tabela').innerHTML=v.length?`<table><tr><th>#</th><th>Notebook</th><th>Preço</th><th>Loja</th><th>Processador (1 núcleo / vários)</th><th>Placa de vídeo</th><th>Ampliar</th><th>Ruído</th><th>Teclado</th><th>Tela</th><th>Peso</th></tr>${v.map(linhaT).join('')}</table>`:'<p>Nenhum notebook com esses filtros.</p>';
}
function analise(a){
  if(!a){$('ana-c').innerHTML='<p>Análise ainda não escrita.</p>';return;}
  $('ana-c').innerHTML=`<p class="sub">Escrita em ${dataBR(a.data)}. Os preços daqui podem estar mais velhos que os da Lista.</p>`+a.secoes.map(s=>`<h2>${esc(s.titulo)}</h2>`+(s.paragrafos||[]).map(t=>`<p>${esc(t)}</p>`).join('')+
   (s.itens?`<ul>${s.itens.map(i=>`<li>${i.url?`<a href="${seguro(i.url)}" rel="noopener noreferrer" target="_blank">${esc(i.nome)}</a>`:esc(i.nome)}${i.texto?': '+esc(i.texto):''}</li>`).join('')}</ul>`:'')+
   (s.tabela?`<div class="rolar"><table><tr>${s.tabela[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${s.tabela.slice(1).map(l=>`<tr>${l.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:'')).join('');
}
function aba(q){const l=q==='lista';$('lista').hidden=!l;$('ana').hidden=l;$('b-lista').setAttribute('aria-selected',l);$('b-ana').setAttribute('aria-selected',!l);}
$('b-lista').onclick=()=>aba('lista');$('b-ana').onclick=()=>aba('ana');
['f-preco','f-ram','f-gpu','f-tam','f-est'].forEach(i=>$(i).onchange=desenhar);
(async()=>{
  try{D=await(await fetch('dados.json',{cache:'no-store'})).json();}catch(e){$('idade').textContent='não consegui carregar os dados';return;}
  $('idade').textContent='atualizado '+quando(D.gerado);
  $('cambio').textContent=`Câmbio ${D.cambio.valor.toLocaleString('pt-BR',{minimumFractionDigits:4})} (${D.cambio.fonte}, ${dataBR(D.cambio.data)}). Preço final = etiqueta × 1,095 × câmbio. Teto: US$ ${D.teto_usd.toLocaleString('pt-BR')}. A página da loja é sempre a palavra final.`;
  if((Date.now()-new Date(D.gerado))/36e5>36)$('alerta').innerHTML='<div class="alerta">Dados com mais de 36 horas. Os preços podem estar velhos.</div>';
  quadro();desenhar();
  analise(await fetch('analise.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null));
})();
</script>
</body>
</html>
